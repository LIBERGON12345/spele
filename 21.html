<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
body { background-color:#0cf59c; color: #222222; }
h1 { color: #ff00c8; }
.noteikumi { background-color: #4f0fb6;color: #d1077d;border-radius: 12px; padding: 12px; }
button { background-color: #aa2aff; color: #18d107; border: 0; }
</style>
</head>
<body>
<h1>Zemes krāsotājs</h1>
<section class="noteikumi">
  <h2>Noteikumi</h2>
  <p>Nokrāso visu zemi</p>
  <p>Spēlē un vāc būstus un palīglīdzekļus lai atrāk nokrāsotu zemi.</p>
  <p>Vadi ar būltām vai arī ar w,a,s,d un pelīti</p>
  
  <section id="sakums">
  <button onclick="paraditSpeli()">Sākt spēli!</button>
</section>
<section id="laukums" hidden>
  <h2>Spēles ekrāns</h2>
  <p>Punkti: 0</p>
  <p>Šeit vēlāk būs spēlētājs.</p>
  <button onclick="paraditSakumu()">Atpakaļ</button>
</section>
<script>
// Gatavā palīdzība pogām. Šodien maini lapas tekstu un izvietojumu.
function paraditSpeli() {
  document.getElementById("sakums").hidden = true;
  document.getElementById("laukums").hidden = false;
}
function paraditSakumu() {
  document.getElementById("sakums").hidden = false;
  document.getElementById("laukums").hidden = true;
}
</script>
</section>
</body>
</html>
